parameters:
  - name: agent_context_id
    optional: true
  - name: agent_task_id
    optional: true

action_groups:
  - actions:
    - type: agent-request
      agent_type: remote
      system_alias: SUCCESS_STORIES_AGENT
      body: >
        {
          "contextId": "<? agent_context_id ?>",
          "taskId": "<? agent_task_id ?>"
        }
      result_variable: agent_response
  - actions:
    - type: message
      message:
        type: text
        markdown: true
        content: <? agent_response.body.status.message.parts[0].text ?>

result:
  agent_context_id: <? agent_response.body.contextId ?>
  agent_task_id: <? agent_response.body.id ?>
  agent_state: <? agent_response.body.status.state ?>